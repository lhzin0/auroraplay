
name: Publicar AuroraPlay no Firebase

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'firebase.json'
      - '.github/workflows/firebase-hosting-release.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: auroraplay-firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compilar site
        working-directory: website
        env:
          SITE_URL: https://auroraplay.app.br/
          RELEASE_FROM_GITHUB: 'true'
          GITHUB_REPOSITORY: lhzin0/auroraplay
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build
          find dist -type f -iname '*.apk' -delete

      - name: Configurar autenticação Google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: auroraplay-507422

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Publicar Firebase Hosting
        run: |
          firebase deploy --only hosting \
            --project auroraplay-507422 \
            --non-interactive
