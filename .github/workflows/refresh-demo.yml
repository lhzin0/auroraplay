name: Atualizar guia de demonstração

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/scripts/generate-demo.py"
      - ".github/workflows/refresh-demo.yml"

permissions:
  contents: write

concurrency:
  group: refresh-demo
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Gerar e validar M3U e XMLTV
        run: |
          python3 website/scripts/generate-demo.py
          python3 website/scripts/generate-demo.py --check
      - name: Publicar somente os dados de demonstração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/demo/aurora-demo.m3u website/demo/aurora-demo.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualizar programação fictícia de demonstração"
          git push origin HEAD:main
