name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android — testes, lint, APK de debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # O build pela linha de comando exige JDK 21 (o Gradle 8.14.x quebra
          # com JDK 25). compileOptions do app continuam em Java 17.
          java-version: "21"
          cache: gradle

      - name: Validar o Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # configuration-cache fica OFF de propósito (ver gradle.properties); o CI
      # não injeta -Pandroid.injected.testOnly, então assembleDebug é seguro.
      - name: Testes unitários e APK de debug
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      # Lint não bloqueia o CI enquanto houver dívida pré-existente. O relatório
      # vai como artefato; considere `lint { baseline = ... }` para travar regressões.
      - name: Android Lint (informativo)
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon

      - name: Publicar relatórios
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

  website:
    name: Site — build estático
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build e verificação do site
        working-directory: website
        run: node scripts/build.mjs
