org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true
# NOTE: configuration-cache is left OFF on purpose. With it on, a build the
# IDE ran once (which injects -Pandroid.injected.testOnly=true and friends)
# gets its configuration cached, and every later CLI `assembleDebug` then
# reuses it — stamping android:testOnly="true" into the debug manifest, which
# makes the installed app refuse to launch ("crash sem abrir").
# org.gradle.configuration-cache=true
